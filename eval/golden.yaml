# Golden set for inbox/samples/. SYNTHETIC: every enquiry is invented.
# Expected values were written by hand from the sample text and the rate card, before the
# extractor existed. They record what a careful person would read, not what RuleExtractor outputs.
#
# areas: list of [area, unit] per site, in the order the enquiry mentions them.
# total: expected Quote.total as a string, only where the outcome is a quote.
# missing: the fields a clarification must ask for (exactly these, nothing else).

s01-complete-email:
  extraction: {is_enquiry: true, contact_email: dana.okafor@northwind-accounting.example, service: regular_office, frequency: weekly, areas: [[4500, sqft]], add_ons: [], out_of_scope: []}
  outcome: quote
  total: "1197.00"      # 4500 x 0.07 x 0.95 = 299.25 a visit, x 4
