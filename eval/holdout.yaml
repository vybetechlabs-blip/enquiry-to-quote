# Held-out set for inbox/holdout/. SYNTHETIC: every enquiry is invented.
#
# Provenance (2026-10-25): written by a separate agent (Claude in chat) in a session that had NOT seen
# inbox/samples/ or e2q/extract/rules.py. It HAD seen business/pricing.yaml, business/business.yaml
# (which carries the extractor's keyword maps), e2q/schema.py and eval/golden.yaml (expected values,
# not sample texts). Phrasings were chosen the way a customer writes, not the way the keyword maps read.
# Expected values are hand-worked from the rate card; the arithmetic sits beside each total.
#
# Same format as golden.yaml: areas = [[area, unit]] per site in the order mentioned; total only for quotes;
# missing = exactly the fields a clarification must ask for.
#
# Cases that probe known gaps (a miss here is information, not a bug to patch by hand):
#   h06  web form with an empty email: no reply address, so handoff (report decision, Checkpoint 0)
#   h09  "twice a week" is not on the rate card and has no Frequency literal; a careful person hands off
#   h12  out-of-scope service phrased without any listed keyword ("outside of the building's glass facade")
#   h13  area given as a range; a careful person asks rather than picks a number
#   h14  100 sq ft is under the sanity band's minimum site area, so handoff not quote

h01-weekly-plain:
  extraction: {is_enquiry: true, contact_email: marisol@vega-architecture.example, service: regular_office, frequency: weekly, areas: [[3800, sqft]], add_ons: [], out_of_scope: []}
  outcome: quote
  total: "1010.80"      # 3800 x 0.07 x 0.95 = 252.70 a visit, x 4
