# Held-out set 2 for inbox/holdout2/. SYNTHETIC: every enquiry is invented.
#
# Provenance (2026-10-25): written by a separate agent (Claude in chat) that had NOT seen inbox/samples/,
# e2q/extract/rules.py, or the LLM extraction prompt (frozen at c721c7a1570d before this set existed).
# It HAD seen business/pricing.yaml, business/business.yaml (keyword maps), e2q/schema.py, eval/golden.yaml
# and eval/holdout.yaml. No case or wording here repeats set 1. Totals are hand-worked from the rate card.
#
# Same format as golden.yaml: areas = [[area, unit]] per site in the order mentioned; total only for quotes;
# missing = exactly the fields a clarification must ask for.
#
# Cases to watch (a miss is information, not a bug to patch by hand):
#   k06  within the per-site area band but over the monthly total cap, so handoff not quote
#   k07  three sites, one under the minimum, multi-site discount on the total
#   k09  three required fields missing at once; the ask must be exactly those three
#   k10  pest control phrased without any listed keyword ("mouse problem")
#   k11  injection in a web-form message field, not an email P.S.
#   k13  reply chain where the new message corrects a figure in the quoted history

