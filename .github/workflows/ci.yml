name: CI

# Push and pull request: two jobs (Windows 3.12, Ubuntu 3.11).
# Manual run (Actions tab, "Run workflow"): the full matrix, Ubuntu 3.11/3.12/3.13 + Windows 3.12.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"windows-latest","python":"3.12"}]' || '[{"os":"windows-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.11"}]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Pipeline smoke (ingest, list, eval)
        env:
          E2Q_DB: ci-smoke.db
        run: |
          uv run e2q ingest "inbox/samples/*.json"
          uv run e2q list
          uv run e2q eval --out ci-report.md
