[project]
name = "enquiry-to-quote"
version = "0.1.0"
description = "Inbound enquiry to priced draft quote, with a human approval gate before anything is sent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "smb-agent-kit",
    "typer>=0.26.8",
]

[project.scripts]
e2q = "e2q.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=0.116.0",
]

[tool.uv.sources]
smb-agent-kit = { git = "https://github.com/vybetechlabs-blip/smb-agent-kit", rev = "15f062d76892164a24a5d4c6f2efeb9225e651f5" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2q"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The eval report renderer builds long Markdown table rows; splitting them hurts reading.
"e2q/evaluate.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as argument defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
